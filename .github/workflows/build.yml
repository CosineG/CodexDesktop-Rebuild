name: Build Artifacts

on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        type: choice
        options: [all, mac, windows, linux]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  build-mac:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'mac' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: |
          npm ci
      - run: |
          brew install --quiet sevenzip
      - name: Test patch and build scripts on macOS
        run: npm test
      - run: node scripts/sync-upstream.js --force --skip-win
      - name: Check upstream patch compatibility
        run: node scripts/patch-all.js mac-${{ matrix.arch }} --check --report patch-reports/mac-${{ matrix.arch }}-check

      - name: Patch
        run: node scripts/patch-all.js mac-${{ matrix.arch }} --report patch-reports/mac-${{ matrix.arch }}-apply

      - name: Upload patch compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Patch-Reports-macOS-${{ matrix.arch }}
          path: patch-reports/
          if-no-files-found: ignore
      - run: npm run build:mac-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: Codex-macOS-${{ matrix.arch }}
          path: out/*.dmg
          if-no-files-found: error

  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: |
          npm ci
      - run: npm test
      - run: |
          choco install 7zip -y
      - name: Add 7zz alias
        run: |
          Copy-Item "C:\Program Files\7-Zip\7z.exe" "C:\Program Files\7-Zip\7zz.exe"
          echo "C:\Program Files\7-Zip" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: node scripts/sync-upstream.js --force --skip-mac
      - name: Check upstream patch compatibility
        run: node scripts/patch-all.js win --check --report patch-reports/windows-x64-check

      - name: Patch
        run: node scripts/patch-all.js win --report patch-reports/windows-x64-apply

      - name: Upload patch compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Patch-Reports-Windows-x64
          path: patch-reports/
          if-no-files-found: ignore
      - run: npm run build:win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: Codex-Windows-x64
          path: out/*.zip
          if-no-files-found: error

  build-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h /
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: |
          npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg 7zip unzip
      - run: node scripts/sync-upstream.js --force --skip-win
      - name: Check upstream patch compatibility
        run: node scripts/patch-all.js mac-${{ matrix.arch }} --check --report patch-reports/linux-${{ matrix.arch }}-check

      - name: Patch
        run: node scripts/patch-all.js mac-${{ matrix.arch }} --report patch-reports/linux-${{ matrix.arch }}-apply

      - name: Upload patch compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Patch-Reports-Linux-${{ matrix.arch }}
          path: patch-reports/
          if-no-files-found: ignore
      - run: npm run build:linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: Codex-Linux-${{ matrix.arch }}
          path: |
            out/make/deb/**/*.deb
            out/make/rpm/**/*.rpm
            out/make/zip/**/*.zip
          if-no-files-found: error
